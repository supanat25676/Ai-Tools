<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA MESH // AI TOOLS PORTFOLIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --panel-bg: rgba(13, 17, 38, 0.7);
            --card-bg: rgba(20, 26, 56, 0.5);
            --accent-cyan: #00f0ff;
            --accent-magenta: #d946ef;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glow: rgba(0, 240, 255, 0.2);
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Prompt', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(217, 70, 239, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* --- Navbar Area --- */
        .navbar {
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glow);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-family: var(--font-head);
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-status {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            border: 1px solid var(--border-glow);
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 240, 255, 0.05);
        }

        /* --- Main Layout Grid --- */
        .app-container {
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            padding: 30px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            flex: 1;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid var(--border-glow);
            padding: 24px;
            height: fit-content;
            backdrop-filter: blur(8px);
        }

        .sidebar-title {
            font-family: var(--font-head);
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .sidebar-menu { list-style: none; }
        .sidebar-menu li {
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .sidebar-menu li.active, .sidebar-menu li:hover {
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
        }

        /* --- Content Area --- */
        .content-area { display: flex; flex-direction: column; gap: 20px; }

        .hero-banner {
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(8px);
        }

        .hero-banner h1 {
            font-family: var(--font-head);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .hero-banner p { color: var(--text-muted); font-size: 1rem; }

        /* --- Responsive Gallery Grid --- */
        .mesh-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .mesh-card {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }

        .mesh-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        .card-img-holder {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
        }

        .card-img-holder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .mesh-card:hover .card-img-holder img { transform: scale(1.05); }

        .card-meta {
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-meta .title { font-family: var(--font-head); font-size: 0.85rem; }
        .card-meta .tag {
            font-size: 0.7rem;
            color: var(--accent-magenta);
            border: 1px solid rgba(217, 70, 239, 0.3);
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* --- Responsive Queries --- */
        @media (max-width: 1024px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">LUMINA // MESH</div>
        <div class="nav-status">SYSTEM ONLINE</div>
    </nav>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-title">Categories</div>
            <ul class="sidebar-menu">
                <li class="active">All Slides (31)</li>
                <li>AI Tools Overview</li>
                <li>Workflows</li>
                <li>Documentation</li>
            </ul>
        </aside>

        <!-- Main Workspace -->
        <main class="content-area">
            <div class="hero-banner">
                <h1>AI TOOLS PRESENTATION MESH</h1>
                <p>Interactive Slide Deck & Resource Showcase</p>
            </div>

            <div class="mesh-grid" id="mesh-container">
                <!-- Javascript will load 31 cards dynamically -->
            </div>
        </main>
    </div>

    <script>
        const container = document.getElementById('mesh-container');
        const total = 31;

        for (let i = 1; i <= total; i++) {
            const card = document.createElement('div');
            card.className = 'mesh-card';
            card.innerHTML = `
                <div class="card-img-holder">
                    <img src="${i}.png" alt="Slide ${i}" loading="lazy">
                </div>
                <div class="card-meta">
                    <span class="title">NODE_${i.toString().padStart(2, '0')}</span>
                    <span class="tag">SLIDE ${i}</span>
                </div>
            `;
            container.appendChild(card);
        }
    </script>
</body>
</html>
