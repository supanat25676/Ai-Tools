<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TOOLS Presentation | Space Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* --- Space Theme Styling --- */
        :root {
            --bg-color: #050714;
            --card-bg: #0c102b;
            --text-primary: #ffffff;
            --text-secondary: #a6b4c9;
            --neon-blue: #00f0ff;
            --neon-purple: #9d4edd;
            --accent-pink: #ff007f;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Prompt', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            /* Background Space Stars Effect */
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, var(--neon-purple), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        /* --- Header Section --- */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .title-glow {
            font-family: var(--font-title);
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* --- Grid Layout --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 30px;
            padding: 20px 0 60px;
        }

        /* --- Space Card Design --- */
        .space-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .space-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), 0 0 10px rgba(157, 78, 221, 0.3);
        }

        .img-wrapper {
            width: 100%;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .space-card:hover .img-wrapper img {
            transform: scale(1.04);
        }

        .card-info {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-family: var(--font-title);
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        .badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(157, 78, 221, 0.2);
            color: var(--neon-blue);
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .title-glow { font-size: 2.2rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }
    </style>
</head>
<body>

    <header class="container">
        <h1 class="title-glow">AI TOOLS GALAXIES</h1>
        <p>🚀 สไลด์นำเสนอผลงานและเครื่องมือ AI ในรูปแบบธีมสำรวจอวกาศ</p>
    </header>

    <main class="container">
        <div class="gallery-grid" id="slide-gallery">
            <!-- ดึงสไลด์ 1 ถึง 31 มาแสดง -->
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Supanat25676 | Built with GitHub Pages</p>
        </div>
    </footer>

    <script>
        // สคริปต์โหลดรูปสไลด์ 1 - 31 อัตโนมัติ
        const gallery = document.getElementById('slide-gallery');
        const totalSlides = 31;

        for (let i = 1; i <= totalSlides; i++) {
            const card = document.createElement('div');
            card.className = 'space-card';
            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="${i}.png" alt="Slide ${i}" loading="lazy">
                </div>
                <div class="card-info">
                    <span class="card-title">SLIDE ${i.toString().padStart(2, '0')}</span>
                    <span class="badge">ORBIT</span>
                </div>
            `;
            gallery.appendChild(card);
        }
    </script>

</body>
</html>
