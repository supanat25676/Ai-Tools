<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TOOLS Presentation | Space Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050714;
            --card-bg: #0c102b;
            --text-primary: #ffffff;
            --text-secondary: #a6b4c9;
            --neon-blue: #00f0ff;
            --neon-purple: #9d4edd;
            --accent-pink: #ff007f;
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Prompt', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--neon-blue), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, var(--neon-purple), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        header { text-align: center; padding: 60px 20px 40px; }
        .title-glow {
            font-family: var(--font-title);
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            margin-bottom: 10px;
        }
        header p { color: var(--text-secondary); font-size: 1.1rem; }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            padding: 20px 0 60px;
        }

        .space-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .space-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        .img-wrapper img { width: 100%; height: auto; display: block; }

        .card-info {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title { font-family: var(--font-title); font-size: 1rem; color: var(--text-primary); }
        .badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(157, 78, 221, 0.2);
            color: var(--neon-blue);
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        /* --- Fullscreen Modal (ป๊อปอัปขยายสไลด์) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(5, 7, 20, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        .modal-content {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        }
        .close-btn {
            position: absolute;
            top: 20px; right: 35px;
            color: var(--text-primary);
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-btn:hover { color: var(--accent-pink); }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(12, 16, 43, 0.8);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            font-size: 30px;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
        }
        .nav-btn:hover { background: var(--neon-blue); color: #000; }
        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }

        footer { text-align: center; padding: 30px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-secondary); }
    </style>
</head>
<body>

    <header class="container">
        <h1 class="title-glow">AI TOOLS GALAXIES</h1>
        <p>🚀 คลิกที่รูปสไลด์เพื่อเปิดดูภาพขนาดใหญ่</p>
    </header>

    <main class="container">
        <div class="gallery-grid" id="slide-gallery"></div>
    </main>

    <!-- Modal Box สำหรับขยายรูปภาพ -->
    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <button class="nav-btn prev-btn" onclick="changeSlide(-1)">&#10094;</button>
        <img class="modal-content" id="modalImg">
        <button class="nav-btn next-btn" onclick="changeSlide(1)">&#10095;</button>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Supanat25676 | Built with GitHub Pages</p>
        </div>
    </footer>

    <script>
        const gallery = document.getElementById('slide-gallery');
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const totalSlides = 31;
        let currentIndex = 1;

        // สร้างรายการสไลด์
        for (let i = 1; i <= totalSlides; i++) {
            const card = document.createElement('div');
            card.className = 'space-card';
            card.onclick = () => openModal(i);
            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="${i}.png" alt="Slide ${i}" loading="lazy">
                </div>
                <div class="card-info">
                    <span class="card-title">SLIDE ${i.toString().padStart(2, '0')}</span>
                    <span class="badge">VIEW</span>
                </div>
            `;
            gallery.appendChild(card);
        }

        function openModal(index) {
            currentIndex = index;
            modal.style.display = "flex";
            modalImg.src = `${currentIndex}.png`;
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex > totalSlides) currentIndex = 1;
            if (currentIndex < 1) currentIndex = totalSlides;
            modalImg.src = `${currentIndex}.png`;
        }

        // ปิด modal เมื่อกดปุ่ม Esc หรือกดพื้นที่ว่างข้างนอก
        window.onclick = function(event) {
            if (event.target == modal) closeModal();
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeModal();
            if (e.key === "ArrowLeft") changeSlide(-1);
            if (e.key === "ArrowRight") changeSlide(1);
        });
    </script>
</body>
</html>
